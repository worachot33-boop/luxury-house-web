<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Segoe UI, Tahoma, sans-serif">
  <rect width="800" height="520" fill="#FAF7F2"/>
  <rect x="20" y="20" width="760" height="480" rx="12" fill="#FFFFFF" stroke="#DFD4C3" stroke-width="2"/>
  <text x="45" y="56" fill="#9E7B42" font-size="13" font-weight="700" letter-spacing="2">ARCHITECTURAL FLOOR PLAN • UPPER LEVEL</text>
  <text x="45" y="80" fill="#241F1C" font-size="20" font-weight="700">แปลนชั้น 2 (Upper Floor — Private Sanctuary Suites)</text>
  <!-- Upper Footprint -->
  <rect x="95" y="115" width="610" height="345" fill="#FDFBF7" stroke="#241F1C" stroke-width="3"/>
  <!-- Master Bedroom Wing -->
  <rect x="385" y="115" width="320" height="345" fill="#FAF3E6" stroke="#B8965A" stroke-width="2.5"/>
  <text x="545" y="215" text-anchor="middle" fill="#241F1C" font-size="17" font-weight="700">Master Bedroom Suite</text>
  <text x="545" y="238" text-anchor="middle" fill="#8C6D3F" font-size="12">[เตียงบิ้วอินหัวเตียงบุหนัง + ระเบียงชมสวน]</text>
  <!-- Walk-in Closet & Master Bath -->
  <rect x="405" y="285" width="280" height="155" fill="#FFFFFF" stroke="#B8965A" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="545" y="352" text-anchor="middle" fill="#241F1C" font-size="14" font-weight="700">Built-in Walk-in Closet &amp; Master Bath</text>
  <text x="545" y="374" text-anchor="middle" fill="#8C6D3F" font-size="11">ตู้กระจกชาทองสูงจรดฝ้า + อ่างล้างหน้าคู่</text>
  <!-- Bedroom 2 -->
  <rect x="95" y="115" width="290" height="165" fill="#FFFFFF" stroke="#241F1C" stroke-width="2"/>
  <text x="240" y="192" text-anchor="middle" fill="#241F1C" font-size="15" font-weight="700">Bedroom 2 (Ensuite Bathroom)</text>
  <text x="240" y="214" text-anchor="middle" fill="#6E655F" font-size="11">ตู้เสื้อผ้าและโต๊ะทำงานบิ้วอินครบชุด</text>
  <!-- Bedroom 3 & Family Hall -->
  <rect x="95" y="280" width="190" height="180" fill="#FFFFFF" stroke="#241F1C" stroke-width="2"/>
  <text x="190" y="365" text-anchor="middle" fill="#241F1C" font-size="14" font-weight="700">Bedroom 3 (Ensuite)</text>
  <text x="190" y="385" text-anchor="middle" fill="#6E655F" font-size="11">บิ้วอินพร้อมเข้าอยู่</text>
  <rect x="285" y="280" width="100" height="180" fill="#F5EFE6" stroke="#241F1C" stroke-width="2"/>
  <text x="335" y="365" text-anchor="middle" fill="#241F1C" font-size="12" font-weight="700">Family</text>
  <text x="335" y="383" text-anchor="middle" fill="#241F1C" font-size="12" font-weight="700">Lounge</text>
</svg>

