<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Segoe UI, Tahoma, sans-serif">
  <rect width="800" height="520" fill="#FAF7F2"/>
  <rect x="20" y="20" width="760" height="480" rx="12" fill="#FFFFFF" stroke="#DFD4C3" stroke-width="2"/>
  <text x="45" y="56" fill="#9E7B42" font-size="13" font-weight="700" letter-spacing="2">GRAND COURTYARD &amp; MANOR • GROUND LEVEL</text>
  <text x="45" y="80" fill="#241F1C" font-size="20" font-weight="700">แปลนชั้น 1 รุ่นใหญ่ (Grand Courtyard &amp; 4-Car Manor)</text>
  <rect x="45" y="105" width="710" height="365" rx="8" fill="#F2F5EE" stroke="#C9D4BE" stroke-dasharray="6 4"/>
  <!-- L-Shape Grand Footprint -->
  <rect x="75" y="125" width="640" height="325" fill="#FDFBF7" stroke="#241F1C" stroke-width="3"/>
  <!-- Inner Courtyard -->
  <rect x="295" y="125" width="185" height="145" fill="#E6F0E2" stroke="#688862" stroke-width="2"/>
  <text x="387" y="192" text-anchor="middle" fill="#355230" font-size="14" font-weight="700">Private Inner Courtyard</text>
  <text x="387" y="212" text-anchor="middle" fill="#4E6E49" font-size="11">สวนคอร์ทยาร์ดส่วนตัวกลางบ้าน</text>
  <!-- Grand Living & Wine Bar -->
  <rect x="480" y="125" width="235" height="205" fill="#FAF3E6" stroke="#B8965A" stroke-width="2.5"/>
  <text x="597" y="215" text-anchor="middle" fill="#241F1C" font-size="15" font-weight="700">6.8m Double Volume Hall</text>
  <text x="597" y="236" text-anchor="middle" fill="#8C6D3F" font-size="11">[Bookmatch Stone + Wine Bar]</text>
  <!-- Chef Pantry + Thai Kitchen + Maid -->
  <rect x="75" y="125" width="220" height="190" fill="#F7EFE2" stroke="#241F1C" stroke-width="2"/>
  <text x="185" y="205" text-anchor="middle" fill="#241F1C" font-size="14" font-weight="700">10-Seat Dining &amp; Island</text>
  <text x="185" y="226" text-anchor="middle" fill="#8C6D3F" font-size="11">ครัวไทยหนัก + โซนแม่บ้านแยกทางเดิน</text>
  <!-- Executive Study & Elderly Suite -->
  <rect x="75" y="315" width="220" height="135" fill="#FFFFFF" stroke="#241F1C" stroke-width="2"/>
  <text x="185" y="378" text-anchor="middle" fill="#241F1C" font-size="14" font-weight="700">Elderly Suite &amp; Study Room</text>
  <text x="185" y="398" text-anchor="middle" fill="#6E655F" font-size="11">พื้นไร้ธรณีประตู + ห้องน้ำในตัว</text>
  <!-- 3-4 Car Garage -->
  <rect x="295" y="330" width="420" height="120" fill="#F3EFEA" stroke="#241F1C" stroke-width="2"/>
  <text x="505" y="385" text-anchor="middle" fill="#241F1C" font-size="15" font-weight="700">Grand Covered Garage (จอดรถ 3–4 คัน)</text>
  <text x="505" y="406" text-anchor="middle" fill="#8C6D3F" font-size="11">บิ้วอินตู้เก็บอุปกรณ์เต็มผนัง + ระบบ EV Charger 22kW</text>
</svg>

