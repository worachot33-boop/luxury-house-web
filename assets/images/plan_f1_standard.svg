<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Segoe UI, Tahoma, sans-serif">
  <rect width="800" height="520" fill="#FAF7F2"/>
  <rect x="20" y="20" width="760" height="480" rx="12" fill="#FFFFFF" stroke="#DFD4C3" stroke-width="2"/>
  <!-- Header Banner -->
  <text x="45" y="56" fill="#9E7B42" font-size="13" font-weight="700" letter-spacing="2">ARCHITECTURAL FLOOR PLAN • GROUND LEVEL</text>
  <text x="45" y="80" fill="#241F1C" font-size="20" font-weight="700">แปลนชั้น 1 (Ground Floor Layout — Built-in Zoning)</text>
  <!-- Garden Surround -->
  <rect x="45" y="105" width="710" height="365" rx="8" fill="#F2F5EE" stroke="#C9D4BE" stroke-dasharray="6 4"/>
  <text x="615" y="132" fill="#557153" font-size="13" font-weight="600">Private Side Garden</text>
  <!-- Main House Footprint -->
  <rect x="85" y="130" width="500" height="315" fill="#FDFBF7" stroke="#241F1C" stroke-width="3"/>
  <!-- Living & Dining Double Hall -->
  <rect x="285" y="130" width="300" height="195" fill="#FAF4E8" stroke="#B8965A" stroke-width="2"/>
  <text x="435" y="210" text-anchor="middle" fill="#241F1C" font-size="16" font-weight="700">Grand Living &amp; Dining</text>
  <text x="435" y="232" text-anchor="middle" fill="#8C6D3F" font-size="12">[Built-in Marble TV Wall &amp; Cove Light]</text>
  <!-- Pantry & Thai Kitchen -->
  <rect x="85" y="130" width="200" height="145" fill="#F7EFE2" stroke="#241F1C" stroke-width="2"/>
  <text x="185" y="192" text-anchor="middle" fill="#241F1C" font-size="14" font-weight="700">Pantry Island &amp; ครัวไทย</text>
  <text x="185" y="213" text-anchor="middle" fill="#8C6D3F" font-size="11">[Quartz Counter + Built-in Hood]</text>
  <!-- Ground Bedroom / Multipurpose + Powder Room -->
  <rect x="85" y="275" width="200" height="170" fill="#FFFFFF" stroke="#241F1C" stroke-width="2"/>
  <text x="185" y="350" text-anchor="middle" fill="#241F1C" font-size="14" font-weight="700">ห้องนอนชั้นล่าง / ห้องอเนกประสงค์</text>
  <text x="185" y="370" text-anchor="middle" fill="#6E655F" font-size="11">พร้อมห้องน้ำแขกแยกโซนเปียก-แห้ง</text>
  <!-- Covered Garage -->
  <rect x="285" y="325" width="300" height="120" fill="#F3EFEA" stroke="#241F1C" stroke-width="2"/>
  <text x="435" y="382" text-anchor="middle" fill="#241F1C" font-size="15" font-weight="700">Covered Luxury Parking (2–3 คัน)</text>
  <text x="435" y="403" text-anchor="middle" fill="#6E655F" font-size="11">ตู้เก็บรองเท้าบิ้วอินหน้าบ้าน + รองรับ EV Charger</text>
  <!-- Compass -->
  <circle cx="710" cy="425" r="24" fill="#FFFFFF" stroke="#B8965A" stroke-width="1.5"/>
  <text x="710" y="430" text-anchor="middle" fill="#241F1C" font-size="13" font-weight="700">N ▲</text>
</svg>

